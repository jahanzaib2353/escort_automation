<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EA Reporter</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; width: 300px; background: #f4f4f4; }
    h3 { margin: 0 0 15px 0; font-size: 16px; text-align: center; color: #333; }
    label { font-size: 11px; color: #555; display: block; margin-bottom: 4px; margin-top: 10px; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 12px; font-family: inherit; }
    textarea { height: 70px; resize: vertical; }
    .hint { font-size: 10px; color: #777; margin-bottom: 5px; display: block; }
    button { width: 100%; padding: 10px; font-size: 13px; font-weight: bold; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 15px; }
    #startBtn { background-color: #28a745; }
    #startBtn:hover { background-color: #218838; }
    #stopBtn { background-color: #dc3545; display: none; }
    #stopBtn:hover { background-color: #c82333; }
    #status { margin-top: 15px; font-size: 12px; text-align: center; min-height: 30px; color: #333; }
  </style>
</head>
<body>
  <h3>EA Auto Reporter</h3>
  
  <label>Target Account URL:</label>
  <input type="text" id="targetUrl" placeholder="https://escortalligator.com/...">
  
  <label>2Captcha API Key:</label>
  <input type="text" id="apiKey" placeholder="Enter API Key">
  
  <label>Your Email:</label>
  <input type="text" id="email" placeholder="your@email.com">
  
  <label>Report Message Library:</label>
  <textarea id="messages" placeholder="Fake profile&#10;Scam attempt&#10;Duplicate listing"></textarea>
  <span class="hint">One message per line. Bot will rotate them.</span>
  
  <button id="startBtn">START LOOPING</button>
  <button id="stopBtn">STOP LOOPING</button>
  
  <div id="status">Ready</div>

  <script src="popup.js"></script>
</body>
</html>
